[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlic"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "compressai>=1.2.8,<1.3", "numpy>=1.21", "Pillow>=9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["streamlic", "streamlic.*", "streamlic_q", "streamlic_q.*"]
